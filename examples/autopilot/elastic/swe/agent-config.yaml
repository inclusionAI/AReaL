tools: [execute_bash, search_replace, task_done]
step_limit: 4
max_completion_tokens: 2048
temperature: 0.6
top_p: 0.95
frequency_penalty: 0.0
no_tool_call_limit: 1
multiple_tools_limit: 4
instruction: |
  You are fixing a real repository issue. Use the provided tools to inspect files,
  edit the code, and test your fix. The repository is /testbed. Start by inspecting
  the repository using execute_bash. Call task_done when finished. Be concise.
instance_template: |
  Fix this issue in /testbed:
  {{ problem_statement }}
execute_bash_result_template: "{{ output }}"
no_tool_warning: "Use a provided tool to inspect or edit the repository."
task_done_warning: "Use the task_done tool to submit the patch."
