<svg xmlns="http://www.w3.org/2000/svg" id="elastic-loops-compact" width="736" height="554" viewBox="0 0 736 554" role="img" aria-labelledby="compact-loops-title compact-loops-desc">
    <style>
#elastic-loops-compact {
  --font-size-base: 14px;
  --foreground: #1f2937;
  --muted-foreground: #667085;
  --background: #ffffff;
  --border: #cfd7e3;
  --viz-series-1: #2563eb;
  --viz-series-2: #b85d09;
  --viz-series-3: #167549;
  font: 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}

    #elastic-loops-compact text { fill: var(--foreground); font-weight: 400; }
    #elastic-loops-compact .heading, #elastic-loops-compact .title { font-weight: 500; }
    #elastic-loops-compact .small { font-size: .857142857em; }
    #elastic-loops-compact .secondary { fill: var(--muted-foreground); }
    #elastic-loops-compact .node { fill: var(--background); stroke: var(--border); stroke-width: 1; }
    #elastic-loops-compact .policy-fill { fill: var(--viz-series-1); fill-opacity: .08; }
    #elastic-loops-compact .model-fill { fill: var(--viz-series-2); fill-opacity: .08; }
    #elastic-loops-compact .optimizer-fill { fill: var(--viz-series-3); fill-opacity: .08; }
    #elastic-loops-compact .edge { fill: none; stroke: var(--muted-foreground); stroke-width: 1.5; stroke-linejoin: round; }
    #elastic-loops-compact .policy { stroke: var(--viz-series-1); }
    #elastic-loops-compact .model { stroke: var(--viz-series-2); }
    #elastic-loops-compact .optimizer { stroke: var(--viz-series-3); }
    #elastic-loops-compact .pending { stroke-dasharray: 5 4; }
  </style>
<title id="compact-loops-title">Policy 与两个独立 revision 闭环</title>
    <desc id="compact-loops-desc">Policy loop 用 cost model M 和 optimizer O 选择执行配置。Actor 与 Actor＋Rollout 联合自动决策均接入配置执行、提交观测与再规划；联合路径采用严格串行 fixture。Cost-model revision 由 agent 修改模型，由 model evaluator 根据历史实测反馈。模型阶段结束后固定有效模型 M*，重评旧 optimizer，再按配置质量与搜索开销修订搜索。运行历史采集、双组件独立验收与联合 bundle 激活已在 Qwen3-0.6B H20 严格串行 fixture 验证。合成轨迹和确定性 proposer 不证明训练质量或成本收益。</desc>
    <defs>
      <marker id="compact-arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5"/></marker>
      <marker id="compact-arrow-policy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--viz-series-1)" stroke-width="1.5"/></marker>
      <marker id="compact-arrow-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--viz-series-2)" stroke-width="1.5"/></marker>
      <marker id="compact-arrow-optimizer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--viz-series-3)" stroke-width="1.5"/></marker>
    </defs>
    <rect width="736" height="554" fill="var(--background)"/>
    <g id="compact-loops-drawing">
      <text class="heading" x="32" y="20">Policy loop</text>
      <path class="edge policy" d="M632 58 V36 H112 V58" marker-end="url(#compact-arrow-policy)"/>
      <text class="small secondary" x="368" y="29" text-anchor="middle">观测反馈</text>
      <path class="edge policy" d="M176 87 H272" marker-end="url(#compact-arrow-policy)"/>
      <path class="edge policy" d="M464 87 H560" marker-end="url(#compact-arrow-policy)"/>
      <text class="small secondary" x="512" y="76" text-anchor="middle">自动应用</text>
      <rect class="node" x="48" y="58" width="128" height="58" rx="6"/>
      <text class="title" x="112" y="81" text-anchor="middle">状态</text>
      <text class="small" x="112" y="101" text-anchor="middle">配置 / 负载</text>
      <rect class="node" x="272" y="58" width="192" height="58" rx="6"/>
      <rect class="policy-fill" x="272" y="58" width="192" height="58" rx="6"/>
      <text class="title" x="368" y="81" text-anchor="middle">Policy = M + O</text>
      <text class="small" x="368" y="101" text-anchor="middle">模型预测 → 配置搜索</text>
      <rect class="node" x="560" y="58" width="144" height="58" rx="6"/>
      <text class="title" x="632" y="81" text-anchor="middle">Config apply</text>
      <text class="small" x="632" y="101" text-anchor="middle">Actor + Rollout</text>

      <path class="edge" d="M632 116 V222" marker-end="url(#compact-arrow-neutral)"/>
      <text class="small secondary" x="646" y="174">历史实测</text>
      <text class="small secondary" x="646" y="193">配置 / 负载</text>
      <text class="heading" x="32" y="195">Cost-model revision</text>
      <path class="edge model" d="M176 254 H272" marker-end="url(#compact-arrow-model)"/>
      <path class="edge model" d="M464 254 H560" marker-end="url(#compact-arrow-model)"/>
      <path class="edge model" d="M632 286 V316 H112 V286" marker-end="url(#compact-arrow-model)"/>
      <text class="small secondary" x="368" y="309" text-anchor="middle">评价反馈</text>
      <rect class="node" x="48" y="222" width="128" height="64" rx="6"/>
      <text class="title" x="112" y="247" text-anchor="middle">Agent</text>
      <text class="small" x="112" y="267" text-anchor="middle">修订模型</text>
      <rect class="node" x="272" y="222" width="192" height="64" rx="6"/>
      <rect class="model-fill" x="272" y="222" width="192" height="64" rx="6"/>
      <text class="title" x="368" y="247" text-anchor="middle">候选 Cost model</text>
      <text class="small" x="368" y="267" text-anchor="middle">预测历史执行</text>
      <rect class="node" x="560" y="222" width="144" height="64" rx="6"/>
      <text class="title" x="632" y="247" text-anchor="middle">Model evaluator</text>
      <text class="small" x="632" y="267" text-anchor="middle">误差 / 覆盖</text>

      <path class="edge model" d="M632 316 V350 H368 V388" marker-end="url(#compact-arrow-model)"/>
      <path class="edge model" d="M632 350 V388" marker-end="url(#compact-arrow-model)"/>
      <circle cx="632" cy="350" r="2.5" fill="var(--viz-series-2)"/>
      <text class="small secondary" x="500" y="342" text-anchor="middle">固定 M* · 重评旧 O</text>
      <text class="heading" x="32" y="361">Optimizer revision</text>
      <path class="edge optimizer" d="M176 420 H272" marker-end="url(#compact-arrow-optimizer)"/>
      <path class="edge optimizer" d="M464 420 H560" marker-end="url(#compact-arrow-optimizer)"/>
      <path class="edge optimizer" d="M632 452 V482 H112 V452" marker-end="url(#compact-arrow-optimizer)"/>
      <text class="small secondary" x="368" y="475" text-anchor="middle">评价反馈</text>
      <rect class="node" x="48" y="388" width="128" height="64" rx="6"/>
      <text class="title" x="112" y="413" text-anchor="middle">Agent</text>
      <text class="small" x="112" y="433" text-anchor="middle">修订搜索</text>
      <rect class="node" x="272" y="388" width="192" height="64" rx="6"/>
      <rect class="optimizer-fill" x="272" y="388" width="192" height="64" rx="6"/>
      <text class="title" x="368" y="413" text-anchor="middle">候选 Optimizer</text>
      <text class="small" x="368" y="433" text-anchor="middle">在 M* 上搜索</text>
      <rect class="node" x="560" y="388" width="144" height="64" rx="6"/>
      <text class="title small" x="632" y="413" text-anchor="middle">Optimizer evaluator</text>
      <text class="small" x="632" y="433" text-anchor="middle">配置质量 / 搜索开销</text>

      <path class="edge" d="M632 482 V522 H18 V142 H368 V116" marker-end="url(#compact-arrow-neutral)"/>
      <text class="small secondary" x="368" y="515" text-anchor="middle">有效 M* + O* → 后续窗口</text>
      <text class="small secondary" x="32" y="547">联合 policy / revision：严格串行 fixture</text>
    </g>
  </svg>
