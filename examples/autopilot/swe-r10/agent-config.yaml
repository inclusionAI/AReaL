tools: [execute_bash, search_replace, task_done]
step_limit: 24
max_completion_tokens: 4096
temperature: 1.0
top_p: 1.0
frequency_penalty: 0.0
no_tool_call_limit: 3
multiple_tools_limit: 4
instruction: |
  You are fixing a real repository issue in /testbed. Inspect source files,
  implement a robust fix, and run focused tests. Use execute_bash to inspect
  the repository first. Keep command output short: use rg, head and bounded
  sed ranges. Do not print entire directories or run the complete test suite.
  Do not change existing tests or configuration. Call task_done when done.
instance_template: |
  Fix this issue in /testbed:
  {{ problem_statement }}
execute_bash_result_template: |
  returncode={{ output['returncode'] }}
  {{ output['output'][:12000] }}
no_tool_warning: "Use a provided tool to inspect or edit the repository."
task_done_warning: "Use task_done to submit the patch."
