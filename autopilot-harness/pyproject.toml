[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autopilot-harness"
version = "0.1.0"
description = "AReaL AutoPilot harness: observation and execution context"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
wandb = ["wandb>=0.19,<1"]

[project.scripts]
autopilot-harness = "autopilot_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
